databases:
  - name: cassa-parrocchiale-db
    plan: free
    databaseName: cassa_parrocchiale
    user: cassa

services:
  # Backend API (Express + Prisma). Runs migrations and the (idempotent) seed
  # script on every deploy, then starts the server.
  - type: web
    name: cassa-parrocchiale-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma migrate deploy && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cassa-parrocchiale-db
          property: connectionString
      - key: CLIENT_URL
        value: https://cassa-parrocchiale-web.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 30d
      # Optional: fill these in from the Render dashboard once you have them.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Cassa Parrocchiale <no-reply@cassaparrocchiale.local>"
      - key: DEFAULT_PARISH_NAME
        value: "Parrocchia Santa Maria"
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false

  # Frontend PWA (static build served by Render's static site hosting).
  - type: web
    name: cassa-parrocchiale-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cassa-parrocchiale-api.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
