services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cassa
      POSTGRES_PASSWORD: cassa
      POSTGRES_DB: cassa_parrocchiale
    ports:
      - "5432:5432"
    volumes:
      - cassa_db_data:/var/lib/postgresql/data

volumes:
  cassa_db_data:
