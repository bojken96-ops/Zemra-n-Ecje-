# StreamPulse AI - local stack. All ports bind to 127.0.0.1 only: nothing is exposed to the network.
# The Windows capture agent runs natively on the host (see docs/CAPTURE.md) and talks to the backend
# at http://127.0.0.1:8000 with CAPTURE_AGENT_TOKEN. It writes recordings into ./storage, which is
# bind-mounted here as /data/storage so the workers can read them.
name: streampulse

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-streampulse}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-streampulse}
    REDIS_URL: redis://redis:6379/0
    STORAGE_ROOT: /data/storage
    STREAMPULSE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streampulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-streampulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streampulse} -d ${POSTGRES_DB:-streampulse}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # no published port: only reachable from the internal network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: { context: ., dockerfile: docker/Dockerfile.backend }
    restart: unless-stopped
    <<: *backend-env
    command: ["api"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/data/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: docker/Dockerfile.worker }
    restart: unless-stopped
    <<: *backend-env
    command: ["worker"]
    volumes:
      - ./storage:/data/storage
      - models:/data/models
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  beat:
    build: { context: ., dockerfile: docker/Dockerfile.worker }
    restart: unless-stopped
    <<: *backend-env
    command: ["beat"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/ws}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  models:
